apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-backend
  labels:
    app: library
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library
      component: backend
  template:
    metadata:
      labels:
        app: library
        component: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/your-username/library-management-system-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLASK_ENV
          value: "production"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: library-secrets
              key: secret-key
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: library-secrets
              key: jwt-secret-key
        - name: DATABASE_URL
          value: "sqlite:///data/library.db"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: library-backend-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: library-backend-service
  labels:
    app: library
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: library
    component: backend
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library-backend-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
