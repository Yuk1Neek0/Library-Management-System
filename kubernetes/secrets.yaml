apiVersion: v1
kind: Secret
metadata:
  name: library-secrets
type: Opaque
stringData:
  # IMPORTANT: Replace these with your actual secret values
  # In production, use a secrets management tool like:
  # - Kubernetes Secrets
  # - HashiCorp Vault
  # - AWS Secrets Manager
  # - Azure Key Vault
  # - Google Secret Manager

  secret-key: "CHANGE-THIS-TO-YOUR-ACTUAL-SECRET-KEY"
  jwt-secret-key: "CHANGE-THIS-TO-YOUR-ACTUAL-JWT-SECRET-KEY"

# To create secrets from command line instead:
# kubectl create secret generic library-secrets \
#   --from-literal=secret-key='your-secret-key' \
#   --from-literal=jwt-secret-key='your-jwt-secret-key'

# To create from file:
# kubectl create secret generic library-secrets --from-env-file=.env
